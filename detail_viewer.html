<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>詳細ビューワー</title>
<style>body{font-family:sans-serif;margin:0;background:#222;color:#eee;}.navbar{background:#111;padding:10px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #444;}
.navbar a{color:#4db8ff;text-decoration:none;font-weight:bold;}.container{display:flex;height:calc(100vh - 40px);}
.sidebar{width:320px;background:#333;padding:20px;box-shadow:2px 0 5px rgba(0,0,0,0.5);}.sidebar h2{color:#4db8ff;border-bottom:1px solid #555;padding-bottom:10px;}
.info-table{width:100%;border-collapse:collapse;margin-bottom:20px;}.info-table th,.info-table td{border-bottom:1px solid #444;padding:8px 5px;text-align:left;font-size:0.9rem;}.info-table th{color:#aaa;width:40%;}
.main-content{flex:1;padding:20px;display:flex;flex-direction:column;align-items:center;overflow-y:auto;}.image-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:1200px;}
.img-card{background:#333;border:1px solid #444;border-radius:8px;padding:15px;text-align:center;}.img-card img{max-width:100%;max-height:400px;border-radius:4px;object-fit:contain;background:white;}
.err-msg{color:#ff6b6b;font-size:0.9rem;margin-top:20px;display:none;}</style></head>
<body><div class="navbar"><span id="event-title">詳細ビューワー: 読込中...</span><a href="javascript:window.close();">✖ タブを閉じる</a></div>
<div class="container"><div class="sidebar"><h2>イベント基本情報</h2><table class="info-table"><tr><th>イベントID</th><td id="info-id">-</td></tr><tr><th>シナリオ</th><td id="info-scenario">-</td></tr><tr><th>発生年</th><td id="info-year">-</td></tr></table><p style="color:#aaa;font-size:0.8rem;">※imagesフォルダ内の図面を表示します。</p></div>
<div class="main-content"><div class="image-grid">
<div class="img-card"><h4>ハイドロ・ハイエトグラフ</h4><img id="img-hydro" src="" onerror="handleError(this)"><div class="err-msg">画像が見つかりません。</div></div>
<div class="img-card"><h4>気象場・天気図</h4><img id="img-weather" src="" onerror="handleError(this)"><div class="err-msg">画像が見つかりません。</div></div>
<div class="img-card" style="grid-column:span 2;"><h4>最大浸水深分布マップ</h4><img id="img-inundation" src="" style="max-height:600px;" onerror="handleError(this)"><div class="err-msg">画像が見つかりません。</div></div>
</div></div></div>
<script>const params=new URLSearchParams(window.location.search);const eventId=params.get("event");if(eventId){document.getElementById("event-title").textContent=`詳細ビューワー: ${eventId}`;document.getElementById("info-id").textContent=eventId;const parts=eventId.split("_");if(parts.length>=3){document.getElementById("info-year").textContent=parts.pop()+"年";parts.pop();document.getElementById("info-scenario").textContent=parts.join("_");}
const basePath=`images/${eventId}/`;document.getElementById("img-hydro").src=basePath+"hyeto_hydro.png";document.getElementById("img-weather").src=basePath+"weather_map.png";document.getElementById("img-inundation").src=basePath+"inundation.png";}function handleError(img){img.style.display="none";img.nextElementSibling.style.display="block";}</script></body></html>
